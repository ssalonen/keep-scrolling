name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"   # every Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # needed to upload SARIF to the GitHub Security tab

jobs:
  # CodeQL static analysis on the content script. The extension has no
  # dependencies, so there is nothing to scan for known CVEs — this guards the
  # only code we ship.
  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

      # TEMPORARY DIAGNOSTIC — remove before merge. The code-scanning gate
      # reports alert counts but not locations, and nothing else here can read
      # the annotations, so print the SARIF results directly.
      - name: Print CodeQL findings
        if: always()
        run: |
          f="$GITHUB_WORKSPACE/../results/javascript.sarif"
          [ -f "$f" ] || { echo "no sarif at $f"; find "$GITHUB_WORKSPACE/.." -name '*.sarif' 2>/dev/null; exit 0; }
          jq -r '.runs[].results[]
            | "RULE: \(.ruleId)\nAT:   \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)\nMSG:  \(.message.text)\n"' "$f"

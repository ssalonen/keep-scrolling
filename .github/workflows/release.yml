name: Build & Release

# Trigger by pushing a version tag: git tag v1.0.0 && git push origin v1.0.0
# Also callable from ci.yml / bump-version.yml via workflow_call — those callers
# MUST pass `secrets: inherit`, or every signing secret silently expands to ""
# and fastlane dies with a cryptic error (see the gate below).
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
        type: string
      match_readonly:
        # The escape hatch for "App-ID capabilities changed, profiles need
        # regenerating" — without it the only route is re-seeding from a Mac.
        # Needs a *write* deploy key in MATCH_REPO_KEY and an API key allowed to
        # manage profiles; leave it alone for normal releases.
        description: "Set to 'false' to let match regenerate provisioning profiles"
        required: false
        type: string
        default: 'true'

# Serialize releases: never run two at once (racing TestFlight build numbers, or
# racing GitHub Release creation). cancel-in-progress: false so an in-flight
# upload is queued behind, never killed mid-way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Generate, sign, build, upload (needs macOS) ─────────────────────────────
  build:
    name: Sign & upload to TestFlight
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_num: ${{ steps.version.outputs.version_num }}
    env:
      # fastlane (match, gym, pilot) reads all of these. Signing is fully
      # managed by match — no keychains, .p12s, or hand-minted profiles here.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      # Fail safe: anything other than an explicit 'false' means readonly. A
      # tag-push run has no inputs at all, so it lands on 'true'.
      MATCH_READONLY: ${{ inputs.match_readonly == 'false' && 'false' || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION_NUM="${TAG#v}"
          echo "tag=$TAG"                 >> "$GITHUB_OUTPUT"
          echo "version_num=$VERSION_NUM" >> "$GITHUB_OUTPUT"
          # fastlane stamps this into the generated project (see build_signed_ipa).
          echo "MARKETING_VERSION=$VERSION_NUM" >> "$GITHUB_ENV"

      # Fail fast with a clear message if the signing secrets aren't visible.
      # The classic trap: when this workflow runs via workflow_call, the caller
      # must forward secrets with `secrets: inherit` — otherwise every secret
      # silently expands to "" and fastlane dies with a cryptic error.
      - name: Verify signing secrets are present
        run: |
          missing=()
          [ -n "$APPLE_TEAM_ID" ]                || missing+=(APPLE_TEAM_ID)
          [ -n "$APP_STORE_CONNECT_KEY_ID" ]     || missing+=(APP_STORE_CONNECT_KEY_ID)
          [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]  || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [ -n "$APP_STORE_CONNECT_API_KEY_P8" ] || missing+=(APP_STORE_CONNECT_API_KEY_P8)
          [ -n "$MATCH_PASSWORD" ]               || missing+=(MATCH_PASSWORD)
          [ -n "$MATCH_GIT_URL" ]                || missing+=(MATCH_GIT_URL)
          [ -n "${{ secrets.MATCH_REPO_KEY }}" ] || missing+=(MATCH_REPO_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions; if this run came through workflow_call, ensure the caller uses 'secrets: inherit'. See docs/FASTLANE-MIGRATION.md."
            exit 1
          fi

      # Read-only SSH deploy key so match can `git clone` the private signing repo.
      - name: Load match repo SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_REPO_KEY }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Set up Ruby + bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Generates the Xcode project from project.yml. Preinstalled on the GitHub
      # macOS runner images, so this is normally a no-op — installing only when
      # missing keeps a runner-image change from breaking the release, without
      # paying for a brew update on every run.
      - name: Ensure XcodeGen is available
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen not on PATH — installing"
            brew install xcodegen
          fi
          xcodegen --version

      # Generate the Xcode project from project.yml, sync signing (match),
      # archive, export, verify the shipped IPA, and upload to TestFlight — all
      # in the beta lane, so a Mac can reproduce it with
      # `bundle exec fastlane build`.
      - name: Build & upload to TestFlight
        run: bundle exec fastlane beta

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs
          path: |
            ~/Library/Logs/gym
            fastlane/report.xml
          if-no-files-found: ignore

  # ── Changelog + GitHub Release (git-only, cheap ubuntu) ─────────────────────
  # Runs only after a successful upload, so a failed build never publishes a
  # release. No version-bump commit: the tag is the only source of the version
  # (fastlane stamps it into the generated project), so nothing tracked changes.
  publish:
    name: Changelog & GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION_NUM: ${{ needs.build.outputs.version_num }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find previous tag
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags "${TAG}^" 2>/dev/null || echo "")
          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG="(initial release)"
          else
            CHANGELOG=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" \
              --jq '.commits | reverse | .[] | "• \(.commit.message | split("\n")[0]) (\(.author.login // .commit.author.name))"' \
              2>/dev/null || echo "")
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG=$(git log "${PREV_TAG}..${TAG}" --pretty="• %s (%an)" 2>/dev/null || echo "(no changes detected)")
            fi
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "${CHANGELOG:-"(no changes detected)"}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: "Keep Scrolling ${{ env.VERSION_NUM }}"
          body: |
            ## Changes since ${{ env.PREV_TAG }}

            ${{ env.CHANGELOG }}

            ---

            ## Install

            Build `${{ env.VERSION_NUM }} (${{ github.run_number }})` was uploaded to
            [TestFlight](https://appstoreconnect.apple.com/). Once Apple finishes
            processing (usually 5-15 min) it is available to internal testers
            immediately, or to external testers after Beta App Review.

            After installing: **Settings ▸ Apps ▸ Safari ▸ Extensions ▸ Keep
            Scrolling** → enable, set reddit.com to **Allow** (Allow Always
            avoids the per-visit prompt).
